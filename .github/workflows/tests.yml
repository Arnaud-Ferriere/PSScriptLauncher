name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pester, PSScriptAnalyzer and file encoding
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester for Windows PowerShell 5.1
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.6.1 -Force
          'Pester ' + (Get-Module Pester).Version + ' on ' + $PSVersionTable.PSVersion

      - name: Install Pester for PowerShell 7
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.6.1 -Force
          'Pester ' + (Get-Module Pester).Version + ' on ' + $PSVersionTable.PSVersion

      - name: Check UTF-8 BOM and CRLF
        shell: pwsh
        run: |
          $bad = @()
          foreach ($file in Get-ChildItem -Recurse -File -Include *.ps1, *.psm1, *.psd1) {
              $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
              $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
              $text = [System.IO.File]::ReadAllText($file.FullName)
              $bareLf = ([regex]::Matches($text, '(?<!\r)\n')).Count
              if (-not $hasBom -or $bareLf -gt 0) {
                  $bad += "$($file.Name): BOM=$hasBom, bare LF=$bareLf"
              }
          }
          if ($bad.Count -gt 0) {
              $bad | ForEach-Object { Write-Host "::error::$_" }
              throw 'Script files must stay UTF-8 with BOM and CRLF: Windows PowerShell 5.1 otherwise reads accents with the ANSI code page.'
          }
          Write-Host 'Encoding check OK'

      - name: Run Pester on Windows PowerShell 5.1
        id: ps51
        continue-on-error: true
        shell: powershell
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './PSScriptLauncher/Tests'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = 'testResults-ps51.xml'
          $result = Invoke-Pester -Configuration $config
          $summary = "Windows PowerShell 5.1: $($result.PassedCount) passed, $($result.FailedCount) failed, $($result.SkippedCount) skipped, $($result.TotalCount) total"
          Write-Host "::notice::$summary"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### Windows PowerShell 5.1'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          if ($result.TotalCount -lt 20) { throw "Only $($result.TotalCount) test(s) ran: the test path is probably wrong." }
          if ($result.FailedCount -gt 0) { exit 1 }
      - name: Run Pester on PowerShell 7
        id: ps7
        continue-on-error: true
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './PSScriptLauncher/Tests'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = 'testResults-ps7.xml'
          $result = Invoke-Pester -Configuration $config
          $summary = "PowerShell 7: $($result.PassedCount) passed, $($result.FailedCount) failed, $($result.SkippedCount) skipped, $($result.TotalCount) total"
          Write-Host "::notice::$summary"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### PowerShell 7'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ''
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          if ($result.TotalCount -lt 20) { throw "Only $($result.TotalCount) test(s) ran: the test path is probably wrong." }
          if ($result.FailedCount -gt 0) { exit 1 }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: testResults-*.xml
          if-no-files-found: ignore

      - name: Fail if a Pester run failed
        if: always()
        shell: pwsh
        run: |
          $ps51 = '${{ steps.ps51.outcome }}'
          $ps7 = '${{ steps.ps7.outcome }}'
          Write-Host "Windows PowerShell 5.1: $ps51"
          Write-Host "PowerShell 7: $ps7"
          if ($ps51 -ne 'success' -or $ps7 -ne 'success') {
              throw "Pester failed (Windows PowerShell 5.1: $ps51, PowerShell 7: $ps7)."
          }

  scriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $settings = './PSScriptLauncher/PSScriptAnalyzerSettings.psd1'
          $files = @(Get-ChildItem -Recurse -File -Include *.ps1, *.psm1, *.psd1 |
              Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' })
          $issues = @(foreach ($file in $files) {
              Invoke-ScriptAnalyzer -Path $file.FullName -Settings $settings
          })
          if ($issues.Count -gt 0) {
              $issues | Format-Table Severity, RuleName, ScriptName, Line, Message -AutoSize |
                  Out-String -Width 200 | Write-Host
              foreach ($issue in $issues) {
                  Write-Host "::error file=./$($issue.ScriptName),line=$($issue.Line)::$($issue.RuleName): $($issue.Message)"
              }
              throw "$($issues.Count) PSScriptAnalyzer issue(s) found."
          }
          Write-Host "PSScriptAnalyzer: $($files.Count) files, no issue"
