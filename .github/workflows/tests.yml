name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pester:
    name: Pester (${{ matrix.label }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows PowerShell 5.1
            shell: powershell
            slug: ps51
          - label: PowerShell 7
            shell: pwsh
            slug: ps7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester
        shell: ${{ matrix.shell }}
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.6.1 -Force
          'Pester ' + (Get-Module Pester).Version

      - name: Check UTF-8 BOM and CRLF
        shell: ${{ matrix.shell }}
        run: |
          $bad = @()
          foreach ($file in Get-ChildItem -Recurse -File -Include *.ps1, *.psm1, *.psd1) {
              $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
              $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
              $text = [System.IO.File]::ReadAllText($file.FullName)
              $bareLf = ([regex]::Matches($text, '(?<!\r)\n')).Count
              if (-not $hasBom -or $bareLf -gt 0) {
                  $bad += "$($file.Name): BOM=$hasBom, bare LF=$bareLf"
              }
          }
          if ($bad.Count -gt 0) {
              $bad | ForEach-Object { Write-Host "::error::$_" }
              throw 'Script files must stay UTF-8 with BOM and CRLF: Windows PowerShell 5.1 otherwise reads accents with the ANSI code page.'
          }
          Write-Host 'Encoding check OK'

      - name: Run Pester
        shell: ${{ matrix.shell }}
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './PSScriptLauncher/Tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = 'testResults.xml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-${{ matrix.slug }}
          path: testResults.xml
          if-no-files-found: ignore

  scriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $settings = './PSScriptLauncher/PSScriptAnalyzerSettings.psd1'
          $files = @(Get-ChildItem -Recurse -File -Include *.ps1, *.psm1, *.psd1 |
              Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' })
          $issues = @(foreach ($file in $files) {
              Invoke-ScriptAnalyzer -Path $file.FullName -Settings $settings
          })
          if ($issues.Count -gt 0) {
              $issues | Format-Table Severity, RuleName, ScriptName, Line, Message -AutoSize |
                  Out-String -Width 200 | Write-Host
              foreach ($issue in $issues) {
                  Write-Host "::error file=./$($issue.ScriptName),line=$($issue.Line)::$($issue.RuleName): $($issue.Message)"
              }
              throw "$($issues.Count) PSScriptAnalyzer issue(s) found."
          }
          Write-Host "PSScriptAnalyzer: $($files.Count) files, no issue"
